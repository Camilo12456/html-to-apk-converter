name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find project folder
        shell: bash
        run: |
          CFG=$(find . -name capacitor.config.json -not -path "*/node_modules/*" | head -n 1)
          if [ -z "$CFG" ]; then
            echo "::error::capacitor.config.json não encontrado. Envie os arquivos do projeto (package.json, capacitor.config.json, www, assets) para o repositório."
            exit 1
          fi
          echo "PROJECT_DIR=$(dirname "$CFG")" >> "$GITHUB_ENV"

      - name: Prepare project files
        working-directory: ${{ env.PROJECT_DIR }}
        shell: bash
        run: |
          mkdir -p www assets
          if [ -f index.html ]; then mv index.html www/index.html; fi
          for f in icon-only.png icon-foreground.png icon-background.png; do
            if [ -f "$f" ]; then mv "$f" assets/; fi
          done
          if [ ! -f www/index.html ]; then
            echo "::error::index.html não encontrado. Envie o arquivo index.html para o repositório."
            exit 1
          fi
          ls -R www assets

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        shell: bash
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install project dependencies
        working-directory: ${{ env.PROJECT_DIR }}
        run: npm install

      - name: Add Android platform
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          if [ ! -d android ]; then
            npx cap add android
          fi
          ls android

      - name: Generate app icons
        working-directory: ${{ env.PROJECT_DIR }}
        continue-on-error: true
        run: npx capacitor-assets generate --android

      - name: Android permissions
        working-directory: ${{ env.PROJECT_DIR }}
        run: |
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q RECORD_AUDIO "$M"; then
            sed -i '/android.permission.INTERNET/a <uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>' "$M"
            sed -i 's#</manifest>#<queries><intent><action android:name="android.speech.RecognitionService"/></intent></queries></manifest>#' "$M"
          fi

      - name: Sync web files
        working-directory: ${{ env.PROJECT_DIR }}
        run: npx cap sync android

      - name: Build APK
        working-directory: ${{ env.PROJECT_DIR }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JAKO-apk
          path: ${{ env.PROJECT_DIR }}/android/app/build/outputs/apk/debug/*.apk
