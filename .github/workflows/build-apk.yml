      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: {node-version: 20}

      - name: Setup Java
        uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}

      - name: Setup Android SDK
        shell: bash
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install project dependencies
        working-directory: ${{ env.B }}
        run: npm install --legacy-peer-deps

      - name: Add Android platform
        working-directory: ${{ env.B }}
        run: |
          npx cap add android
          ls android

      - name: Beep plugin
        working-directory: ${{ env.B }}
        run: |
          F=$(find android/app/src/main/java -name MainActivity.java | head -n 1)
          cat > "$F" <<'JAVA'
          package com.jako.assistant;
          import android.content.Context;import android.media.AudioManager;import android.os.Bundle;
          import com.getcapacitor.*;import com.getcapacitor.annotation.CapacitorPlugin;
          public class MainActivity extends BridgeActivity {
          @CapacitorPlugin(name = "Beep")
          public static class BeepPlugin extends Plugin {
          private void set(boolean mute) {
          AudioManager am = (AudioManager) getContext().getSystemService(Context.AUDIO_SERVICE);
          int[] st = {AudioManager.STREAM_SYSTEM, AudioManager.STREAM_RING, AudioManager.STREAM_MUSIC, AudioManager.STREAM_ALARM, AudioManager.STREAM_NOTIFICATION};
          for (int s : st) { try { am.adjustStreamVolume(s, mute ? AudioManager.ADJUST_MUTE : AudioManager.ADJUST_UNMUTE, 0); } catch (Exception e) { } }
          }
          @PluginMethod public void mute(PluginCall c) { set(true); c.resolve(); }
          @PluginMethod public void unmute(PluginCall c) { set(false); c.resolve(); }
          @Override protected void handleOnPause() { set(false); }
          @Override protected void handleOnDestroy() { set(false); }
          }
          @Override public void onCreate(Bundle b) { registerPlugin(BeepPlugin.class); super.onCreate(b); }
          }
          JAVA

      - name: Create Ark reactor icon
        working-directory: ${{ env.B }}
        continue-on-error: true
        run: |
          mkdir -p assets
          cat > assets/icon-only.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"><rect width="1024" height="1024" fill="#000"/><g transform="translate(512 512) scale(.7)" fill="none" stroke="#19d3ff"><circle r="471" stroke-width="23"/><circle r="363" stroke="#1e7bff" stroke-width="93" stroke-dasharray="128 100.08"/><circle r="256" stroke-width="20"/><polygon points="0,-174 151,87 -151,87" stroke-width="18" stroke-linejoin="round"/><circle r="61" fill="#dcfaff" stroke="none"/></g></svg>
          SVG
          npx capacitor-assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000'

      - name: Android permissions
        working-directory: ${{ env.B }}
        run: |
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q RECORD_AUDIO "$M"; then
            sed -i '/android.permission.INTERNET/a <uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>' "$M"
            sed -i 's#</manifest>#<queries><intent><action android:name="android.speech.RecognitionService"/></intent><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries></manifest>#' "$M"
          fi

      - name: Sync web files
        working-directory: ${{ env.B }}
        run: npx cap sync android

      - name: Build APK
        working-directory: ${{ env.B }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JAKO-apk
          path: _jako_build/android/app/build/outputs/apk/debug/*.apk
