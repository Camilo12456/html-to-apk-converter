name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    env:
      B: ${{ github.workspace }}/_jako_build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build folder
