name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    env:
      B: ${{ github.workspace }}/_jako_build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build folder
        shell: bash
        run: |
          mkdir -p "$B/www" "$B/assets"
          SRC=""
          for c in jako.html index.html www/index.html; do
            if [ -f "$c" ]; then SRC="$c"; break; fi
          done
          if [ -z "$SRC" ]; then
            SRC=$(find . -name index.html -not -path "*/node_modules/*" | head -n 1)
          fi
          if [ -z "$SRC" ]; then
            echo "::error::Nenhum index.html (ou jako.html) encontrado no repositĆ³rio. Envie o arquivo do app."
            exit 1
          fi
          echo "Usando $SRC"
          cp "$SRC" "$B/www/index.html"
          for f in icon-only icon-foreground icon-background; do
            P=$(find . -name "$f.png" -not -path "*/node_modules/*" -not -path "./_jako_build/*" | head -n 1)
            if [ -n "$P" ]; then cp "$P" "$B/assets/$f.png"; fi
          done
          echo '{"name":"jako","version":"1.0.0","private":true,"dependencies":{"@capacitor/core":"^7.0.0","@capacitor/android":"^7.0.0","@capacitor/app-launcher":"^7.0.0","@capacitor-community/speech-recognition":"^7.0.0"},"devDependencies":{"@capacitor/cli":"^7.0.0","@capacitor/assets":"^3.0.5"}}' > "$B/package.json"
          echo '{"appId":"com.jako.assistant","appName":"JAKO","webDir":"www","android":{"allowMixedContent":true},"plugins":{"CapacitorHttp":{"enabled":true}}}' > "$B/capacitor.config.json"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        shell: bash
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install project dependencies
        working-directory: ${{ env.B }}
        run: npm install

      - name: Add Android platform
        working-directory: ${{ env.B }}
        run: |
          npx cap add android
          ls android

      - name: Create Ark reactor icon
        working-directory: ${{ env.B }}
        continue-on-error: true
        run: |
          pip install pillow -q --break-system-packages || pip install pillow -q
          python3 - <<'PY'
          import math,os
          from PIL import Image,ImageDraw,ImageFilter
          if os.path.exists('assets/icon-only.png'): raise SystemExit
          CY=(25,211,255,255);BL=(30,123,255,255)
          def reactor(size,scale,bg):
              S=size*2;im=Image.new('RGBA',(S,S),(0,0,0,255) if bg else (0,0,0,0))
              L=Image.new('RGBA',(S,S),(0,0,0,0));d=ImageDraw.Draw(L);c=S/2;u=S/2*scale
              ring=lambda r,w,col:d.ellipse([c-r,c-r,c+r,c+r],outline=col,width=int(w))
              ring(.92*u,.045*u,CY)
              for i in range(10):
                  a=math.radians(i*36+18);pts=[]
                  for r,da in((.62,-12),(.80,-9),(.80,9),(.62,12)):
                      q=a+math.radians(da);pts.append((c+r*u*math.cos(q),c+r*u*math.sin(q)))
                  d.polygon(pts,fill=BL)
              ring(.50*u,.04*u,CY)
              tri=[(c+.34*u*math.cos(math.radians(-90+k*120)),c+.34*u*math.sin(math.radians(-90+k*120))) for k in range(3)]
              d.line(tri+[tri[0],tri[1]],fill=CY,width=int(.035*u),joint='curve')
              d.ellipse([c-.12*u,c-.12*u,c+.12*u,c+.12*u],fill=(220,250,255,255))
              H=Image.new('RGBA',(S,S),(0,0,0,0));ImageDraw.Draw(H).ellipse([c-.26*u,c-.26*u,c+.26*u,c+.26*u],fill=(25,211,255,170))
              im=Image.alpha_composite(im,H.filter(ImageFilter.GaussianBlur(S*.03)))
              im=Image.alpha_composite(im,L.filter(ImageFilter.GaussianBlur(S*.012)))
              im=Image.alpha_composite(im,L)
              return im.resize((size,size),Image.LANCZOS)
          reactor(1024,.88,True).save('assets/icon-only.png')
          reactor(1024,.58,False).save('assets/icon-foreground.png')
          Image.new('RGBA',(1024,1024),(0,0,0,255)).save('assets/icon-background.png')
          PY
          npx capacitor-assets generate --android

      - name: Android permissions
        working-directory: ${{ env.B }}
        run: |
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q RECORD_AUDIO "$M"; then
            sed -i '/android.permission.INTERNET/a <uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>' "$M"
            sed -i 's#</manifest>#<queries><intent><action android:name="android.speech.RecognitionService"/></intent></queries></manifest>#' "$M"
          fi

      - name: Sync web files
        working-directory: ${{ env.B }}
        run: npx cap sync android

      - name: Build APK
        working-directory: ${{ env.B }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JAKO-apk
          path: _jako_build/android/app/build/outputs/apk/debug/*.apk
