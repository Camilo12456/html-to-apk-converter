name: Build APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build-android-apk:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: _jako_build
    env:
      B: ${{ github.workspace }}/_jako_build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Prepare build folder
        working-directory: .
        shell: bash
        run: |
          mkdir -p "$B/www" "$B/assets"
          echo "Usando o app Jako embutido neste workflow"
          base64 -d <<'B64' | xz -dc > "$B/www/index.html"
          
          
          
          
          
          
          
          
          
          
          
          
          
          
          B64
          echo '{"name":"jako","version":"1.0.0","private":true,"dependencies":{"@capacitor/core":"^7.0.0","@capacitor/android":"^7.0.0","@capacitor/app-launcher":"^7.0.0","@capacitor-community/speech-recognition":"^7.0.0","@capacitor-community/text-to-speech":"^6.0.0"},"devDependencies":{"@capacitor/cli":"^7.0.0","@capacitor/assets":"^3.0.5"}}' > "$B/package.json"
          echo '{"appId":"com.jako.assistant","appName":"JAKO","webDir":"www","android":{"allowMixedContent":true}}' > "$B/capacitor.config.json"

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with: {node-version: 20}

      - name: Setup Java
        uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '21'}

      - name: Install project dependencies
        run: npm install --legacy-peer-deps

      - name: Add Android platform
        run: |
          npx cap add android
          ls android

      - name: Beep plugin
        run: |
          F=$(find android/app/src/main/java -name MainActivity.java | head -n 1)
          cat > "$F" <<'JAVA'
          package com.jako.assistant;
          import android.app.SearchManager;import android.content.*;import android.media.AudioManager;import android.os.Bundle;import android.provider.MediaStore;import android.view.KeyEvent;
          import com.getcapacitor.*;import com.getcapacitor.annotation.CapacitorPlugin;
          public class MainActivity extends BridgeActivity{
          @CapacitorPlugin(name="Beep") public static class B extends Plugin{
          AudioManager am(){return (AudioManager)getContext().getSystemService(Context.AUDIO_SERVICE);}
          void set(boolean m){for(int s:new int[]{1,2,3,4,5}){try{am().adjustStreamVolume(s,m?AudioManager.ADJUST_MUTE:AudioManager.ADJUST_UNMUTE,0);}catch(Exception e){}}}
          @PluginMethod public void mute(PluginCall c){set(true);c.resolve();}
          @PluginMethod public void unmute(PluginCall c){set(false);c.resolve();}
          @PluginMethod public void play(PluginCall c){
          String q=c.getString("query",""),a=c.getString("app","");
          String[] pk=a.equals("spotify")?new String[]{"com.spotify.music"}:a.equals("youtube music")?new String[]{"com.google.android.apps.youtube.music"}:a.equals("youtube")?new String[]{"com.google.android.youtube"}:new String[]{"com.spotify.music","com.google.android.apps.youtube.music"};
          for(String p:pk){try{getContext().getPackageManager().getPackageInfo(p,0);Intent i=new Intent(MediaStore.INTENT_ACTION_MEDIA_PLAY_FROM_SEARCH);i.setPackage(p);i.putExtra(SearchManager.QUERY,q);i.putExtra(MediaStore.EXTRA_MEDIA_FOCUS,"vnd.android.cursor.item/*");i.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);getContext().startActivity(i);c.resolve();return;}catch(Exception e){}}
          c.reject("nenhum app de musica");}
          @PluginMethod public void media(PluginCall c){
          String k=c.getString("key","pause");
          int n=k.equals("next")?KeyEvent.KEYCODE_MEDIA_NEXT:k.equals("prev")?KeyEvent.KEYCODE_MEDIA_PREVIOUS:k.equals("play")?KeyEvent.KEYCODE_MEDIA_PLAY:KeyEvent.KEYCODE_MEDIA_PAUSE;
          am().dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_DOWN,n));am().dispatchMediaKeyEvent(new KeyEvent(KeyEvent.ACTION_UP,n));c.resolve();}
          @Override protected void handleOnPause(){set(false);}
          @Override protected void handleOnDestroy(){set(false);}}
          @Override public void onCreate(Bundle b){registerPlugin(B.class);super.onCreate(b);}}
          JAVA

      - name: Create Ark reactor icon
        continue-on-error: true
        run: |
          mkdir -p assets
          cat > assets/icon-only.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024"><rect width="1024" height="1024" fill="#000"/><g transform="translate(512 512) scale(.7)" fill="none" stroke="#19d3ff"><circle r="471" stroke-width="23"/><circle r="363" stroke="#1e7bff" stroke-width="93" stroke-dasharray="128 100.08"/><circle r="256" stroke-width="20"/><polygon points="0,-174 151,87 -151,87" stroke-width="18" stroke-linejoin="round"/><circle r="61" fill="#dcfaff" stroke="none"/></g></svg>
          SVG
          npx capacitor-assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000'

      - name: Android permissions
        run: |
          M=android/app/src/main/AndroidManifest.xml
          sed -i '/android.permission.INTERNET/a <uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS"/><uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>' "$M"
          sed -i 's#</manifest>#<queries><intent><action android:name="android.speech.RecognitionService"/></intent><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries></manifest>#' "$M"

      - name: Sync web files
        run: npx cap sync android

      - name: Build APK
        working-directory: _jako_build/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JAKO-apk
          path: _jako_build/android/app/build/outputs/apk/debug/*.apk
