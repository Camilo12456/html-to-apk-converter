      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        shell: bash
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses > /dev/null || true
          $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Install project dependencies
        working-directory: ${{ env.B }}
        run: npm install --legacy-peer-deps

      - name: Add Android platform
        working-directory: ${{ env.B }}
        run: |
          npx cap add android
          ls android

      - name: Create Ark reactor icon
        working-directory: ${{ env.B }}
        continue-on-error: true
        run: |
          mkdir -p assets
          cat > assets/icon-only.svg <<'SVG'
          <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" viewBox="0 0 1024 1024"><defs><polygon id="s" points="-66,-317 -64,-410 64,-410 66,-317" fill="#1e7bff"/><filter id="g" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="18"/></filter></defs><rect width="1024" height="1024" fill="#000"/><g transform="translate(512 512) scale(.7)"><circle r="133" fill="#19d3ff" opacity=".7" filter="url(#g)"/><circle r="471" fill="none" stroke="#19d3ff" stroke-width="23"/><use xlink:href="#s" transform="rotate(18)"/><use xlink:href="#s" transform="rotate(54)"/><use xlink:href="#s" transform="rotate(90)"/><use xlink:href="#s" transform="rotate(126)"/><use xlink:href="#s" transform="rotate(162)"/><use xlink:href="#s" transform="rotate(198)"/><use xlink:href="#s" transform="rotate(234)"/><use xlink:href="#s" transform="rotate(270)"/><use xlink:href="#s" transform="rotate(306)"/><use xlink:href="#s" transform="rotate(342)"/><circle r="256" fill="none" stroke="#19d3ff" stroke-width="20"/><polygon points="0,-174 151,87 -151,87" fill="none" stroke="#19d3ff" stroke-width="18" stroke-linejoin="round"/><circle r="61" fill="#dcfaff"/></g></svg>
          SVG
          npx capacitor-assets generate --android --iconBackgroundColor '#000000' --iconBackgroundColorDark '#000000'

      - name: Android permissions
        working-directory: ${{ env.B }}
        run: |
          M=android/app/src/main/AndroidManifest.xml
          if ! grep -q RECORD_AUDIO "$M"; then
            sed -i '/android.permission.INTERNET/a <uses-permission android:name="android.permission.RECORD_AUDIO"/><uses-permission android:name="android.permission.QUERY_ALL_PACKAGES"/>' "$M"
            sed -i 's#</manifest>#<queries><intent><action android:name="android.speech.RecognitionService"/></intent><intent><action android:name="android.intent.action.TTS_SERVICE"/></intent></queries></manifest>#' "$M"
          fi

      - name: Sync web files
        working-directory: ${{ env.B }}
        run: npx cap sync android

      - name: Build APK
        working-directory: ${{ env.B }}/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug
        env:
          GRADLE_OPTS: -Dorg.gradle.daemon=false

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: JAKO-apk
          path: _jako_build/android/app/build/outputs/apk/debug/*.apk
